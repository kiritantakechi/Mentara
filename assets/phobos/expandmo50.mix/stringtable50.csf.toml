# Chinese strings for the Phobos UI. Ares loads stringtable00-99.csf
# (MO itself ships 09-11 in expandmo98.mix).

[strings]
# Phobos prints "<label> mm:ss", so no trailing space.
"TXT_GAMETIME" = "时间"
"PHOBOS:CostLabel" = "$"
# Shared by tooltips and the credits-bar power counter, which draws in
# the Metal12 numeral font that has no CJK glyphs; the signed value and
# its colour already say "power".
"PHOBOS:PowerLabel" = ""
# Shown alone in the Metal12 power counter during a blackout.
"PHOBOS:PowerBlackoutLabel" = "--"
# Tooltips read "$cost mm:ss +power": the formats identify each value,
# and the string loader strips the trailing space a label would need.
"PHOBOS:TimeLabel" = ""
# Metal12 credits-bar counter: digits only (active/total).
"PHOBOS:HarvesterLabel" = ""
"PHOBOS:SWShotsFormat" = "剩余 %d/%d 次"
