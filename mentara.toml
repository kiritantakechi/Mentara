# Mentara — Cross-Platform Mental Omega Virtual Overlay Launcher
#
# Base game files stay read-only in `base_dir` while custom INI, DLL,
# and asset layers are stacked in a decoupled virtual directory.
# `[linux]` and `[windows]` are symmetric host-platform tables so the
# same repository and profiles run natively on both systems.

base_dir = ".."
default_profile = "default"
exclude = ["Mentara", ".git", ".gitkeep"]
copy_patterns = ["*.ini", "*.cfg", "*.log", "*.sav", "*.key"]

[linux]
# Zero-copy rootless FUSE union mount; runtime under ~/.cache/mentara/runtime,
# persistent writable layer under ~/.local/state/mentara.
backend = "fuse-overlayfs"

[linux.runner]
# Wrapper chain separated by "--": gamescope micro-compositor -> umu-run.
command = [
    "gamescope",
    "-W", "2560",
    "-H", "1440",
    "-w", "1920",
    "-h", "1080",
    "-F", "fsr",
    "-f",
    "--",
    "umu-run",
]
executable = "MentalOmegaClient.exe"
args = []
env = { WINEDLLOVERRIDES = "ddraw=n,b" }

[windows]
# Shadow staging tree using symlinks/hardlinks + isolated writable copies;
# runtime and persistent state under %LOCALAPPDATA%\mentara.
backend = "symlink"

[windows.runner]
# Direct native execution on Windows (empty wrapper command).
command = []
executable = "MentalOmegaClient.exe"
args = []

# Layers stack bottom to top: the game directory, then `overlays/base`
# (Ares-only fixes to Mental Omega itself), then `overlays/phobos`
# (Phobos engine fixes and modernization built on the fixed game), then
# `overlays/enhance` (MO's units, buildings and AI rewritten with Phobos
# mechanics). A profile may stop at any layer but never skips one.

[profiles.default]
description = "Mental Omega Client: MO fixes + Phobos modernization"
layers = ["overlays/base", "overlays/phobos"]
persist_state = true

[profiles.syringe]
description = "gamemd.exe via SyringeEx: MO fixes + Phobos modernization"
layers = ["overlays/base", "overlays/phobos"]
persist_state = true

[profiles.syringe.runner]
executable = "Syringe.exe"
# Same game flags as the client launch line in
# overlays/phobos/Resources/ClientDefinitions.patch.ini. Without
# -AFFINITY, Ares pins the game to a single CPU.
args = [
    "gamemd.exe",
    "--args=-SPAWN -CD -SPEEDCONTROL -LOG -AFFINITY:1048575 -HideVersionWarning=0.5.0.0-alpha2",
]

[profiles.enhance]
description = "Mental Omega Client: MO fixes + Phobos modernization + Phobos gameplay rewrite"
layers = ["overlays/base", "overlays/phobos", "overlays/enhance"]
persist_state = true

[profiles.base]
description = "Mental Omega Client with MO fixes only (Ares 3.0p1, no Phobos)"
layers = ["overlays/base"]
persist_state = true

[profiles.vanilla]
description = "Clean base Mental Omega without overlay layers"
layers = []
persist_state = true
