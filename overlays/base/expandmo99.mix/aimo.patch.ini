; Mental Omega 3.3.6 skirmish AI data fixes (Ares only, no Phobos keys).
; Fixes 1-5 untangle IDs defined twice; 6-8 correct entries that name
; the wrong building or a unit their side cannot build; 9 splits
; side-wide triggers so each country raises teams it can build.
;
; MO's aimo.ini defines several AI IDs twice with different contents.
; The engine merges repeated sections key by key, so one of the teams
; sharing such an ID silently receives the other's units or script
; actions. Each fix below deletes every copy, restores the original
; definition under the original ID, and moves the second definition to
; a fresh `MNT*-G` ID that the matching team or trigger now uses.

; --- 1. TaskForce 0ACDD81CB-G: "4 Robots Water" vs "2 Robots" ----------
; "Allied Robot Tanks Water 1" needs the amphibious ROBOW robots;
; "Allied Robot Tanks Follow" is a land team and gets the ROBO pair.
[-0ACDD81CB-G]

[0ACDD81CB-G]
Name=4 Robots Water
0=4,ROBOW
Group=-1

[MNTTF01-G]
Name=2 Robots
0=2,ROBO
Group=-1

[060F580CC-G]
TaskForce=MNTTF01-G

