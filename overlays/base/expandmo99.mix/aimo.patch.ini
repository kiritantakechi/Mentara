; --- 8. Triggers SOVTRI197/199-G: Soviet AI asked for an Allied plane ---
; The Dustdevil (DUST) is owned by the Allied countries only, so these
; Soviet-side triggers raised teams that never filled and held a team
; slot for DissolveUnfilledTeamDelay. Their difficulty flags are off
; (last three fields) in [AITriggerTypes] below.

; --- 9. Side-wide triggers with a unit one country cannot build ------
; Each country of a side is forbidden one of its side's units and builds
; its own in that slot instead: China the Armadillo for the Borillo,
; Russia the Shock Trooper for the Tesla Trooper and the Tigr for the
; Halftrack, Latin the Bomb Buggy for the Demolition Truck, PsiCorps its
; own Adept, Haihead the Hovracoon for the Raccoon, Last Bastion the
; Condor for the Buzzard. A trigger written for the whole side raised the
; same team for all three countries, so in the forbidden country it never
; filled and held a team slot until it dissolved. Each such trigger is
; switched off (as in fix 8) and every country gets its own copy, named
; the way MO names its country twins (FOETR135LB-G, "Last Bastion -
; Condor Hunt"): the country's code before "-G" (US EU PA, RU LA CH,
; PC SC HQ, HA CO LB, from MO's labels), its label in place of the
; side's, and in the forbidden country its own unit (the one MO pairs
; with it: required for that country where the other is forbidden, with
; the same prerequisites and category, and where a country has two, the
; one firing the same weapons). A country MO already gave its own twin of
; the trigger keeps only that twin. Units no country builds (delivered or
; deployed only) are left as they are.

