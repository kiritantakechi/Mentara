; Mental Omega 3.3.6 art fixes (Ares only, no Phobos keys).
;
; These civilian buildings name a custom palette "cargo", but no
; cargo*.pal exists in any MO archive (every other custom palette ships
; all six theater variants). The engine already falls back to the
; theater's building palette, so dropping the dangling reference keeps
; their look and stops the palette lookup failing, which Phobos reports
; as breaking lighting recalculation.

[CAWHSE]
-Palette

[CAJHUT]
-Palette

[CANHSE01]
-Palette

[CANHSE02]
-Palette

[CAPRSNF]
-Palette

[CASLUMA]
-Palette

[CABRKK]
-Palette

; --- Names YR reads differently -------------------------------------------
; An upgrade slot sorts by PowerUp<n>YSort (gamemd 0x464758), not by
; MO's ActiveAnim-style PowerUp<n>AnimYSort, so the Foehn barracks' add-on
; sorted at 0.
[FABARR]
PowerUp1YSort=324
-PowerUp1AnimYSort

; YR reads ActiveAnim[Two|Three]YSort; the Warpnode, the Experimental
; Warpshop and the campaign Underground Lab misspelt it, so those anims
; drew at YSort 0 against units and their own building.
[GAPOST]
ActiveAnimTwoYSort=362
ActiveAnimThreeYSort=362
-ActiveAnimTwoSort
-ActiveAnimThreeSort

[GACLAB]
ActiveAnimTwoYSort=50
-ActiveAnimTwoZSort

[YAULAB]
ActiveAnimYSort=100
-ActiveAnimSort

; YR reads only numbered AddOccupy<n>/RemoveOccupy<n>; these follow a
; numbered series (or start one) without a number, as Westwood's own did.
[YAROCK]
RemoveOccupy8=-1,-3
-RemoveOccupy

[YAROCK2]
RemoveOccupy8=-1,-3
-RemoveOccupy

[CAVHNG]
RemoveOccupy8=-1,-3
-RemoveOccupy

[CATEXS06]
AddOccupy1=-1,2
-AddOccupy

; --- Sounds that do not exist -----------------------------------------------
; Future Tank laser hits play "Explosion1"; soundmo defines Explosion01.
[XLASRFTR]
Report=Explosion01
