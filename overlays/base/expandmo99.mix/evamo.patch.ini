; Mental Omega 3.3.6 EVA fixes (Ares only, no Phobos keys).

; Campaign and co-op triggers play EVA lines under names [DialogList]
; does not have, so EVA stays silent: "EVA_CriticalStrucureLost" in 22
; mission-fail triggers over 11 maps (aobst, enight, fkill, erage, eblood,
; sarms, sfire and four co-op maps), "EVA_1MinutesRemaining" (sfatal),
; and the cut-off "EVA_Rein" (sdeath) and "EVA_Reinfo" (areddawn). Each
; alias speaks the line the name stands for. New entries go at the end of
; [DialogList], so no existing index moves.
[DialogList]
+=EVA_CriticalStrucureLost
+=EVA_1MinutesRemaining
+=EVA_Rein
+=EVA_Reinfo

[EVA_CriticalStrucureLost]
Text=Critical structure lost.
Russian=csof021
Allied=ceva021
Yuri=cyur021
Foehn=cfoe021

[EVA_1MinutesRemaining]
Text=1 minute remaining.
Russian=csof033
Allied=ceva033
Yuri=cyur033
Foehn=cfoe033

[EVA_Rein]
Text=Reinforcements have arrived.
Russian=csof038
Allied=ceva038
Yuri=cyur038
Foehn=cfoe038
Type=QUEUE
Priority=IMPORTANT

[EVA_Reinfo]
Text=Reinforcements have arrived.
Russian=csof038
Allied=ceva038
Yuri=cyur038
Foehn=cfoe038
Type=QUEUE
Priority=IMPORTANT

; YR never recorded an Epsilon (Yuri) "Paratroopers ready" (cyur150), so
; every Epsilon player's Hijackers and Tech Airport paradrop came ready in
; silence. Epsilon's "Reinforcements ready" (cyur121) says the same thing.
[EVA_ParatroopersReady]
Yuri=cyur121
