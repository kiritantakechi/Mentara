; Mental Omega 3.3.6 rules data fixes (Ares only, no Phobos keys).

; Every rookie tusk and missile weapon of the Catastrophe, Centurion and
; Mammoth tanks fires MammothTuskProj (AA=yes, AG=yes), but the elite
; copy kept vanilla's anti-air-only flag, so promotion took away their
; ground attack (MammothTuskE, CenturionMissilesE, ApocMissileE,
; MammothMissileE).
[MammothTuskProjE]
AG=yes

; The skirmish AI's copy of the Cryocopter lacks the player version's
; Chronoshift.Crushable=no: units chronoshifted onto it crushed it, where
; the player's survives and destroys the arriving unit instead.
[CRYOAI]
Chronoshift.Crushable=no

; --- Refunds and bounties --------------------------------------------------
; MO prices a unit's sell refund (Soylent) at Cost/2 and its kill bounty
; (Bounty.Value) at Cost/5 nearly everywhere (349 and 458 units), and every
; construction yard and MCV refunds 750 and pays 600. These drifted:
; the Foehn yard had the two swapped, the Soviet yard refunded a
; refinery's 300, the Gharial kept an $800 unit's values at $2050, the
; Draco and Diverbee refunded less than half, and the Roadrunner's
; no-attack mode cost 50 more than the mode it toggles from.
[FACNST]
Soylent=750
Bounty.Value=600

[NACNST]
Soylent=750

[GHTNK]
Soylent=1025
Bounty.Value=410

[DRACO]
Soylent=375

[DIVER]
Soylent=450

[ROADR2]
Cost=1250
Soylent=625
Bounty.Value=250

; --- Rookie and elite weapons ---------------------------------------------
; The Gun Turret's warheads were swapped: the rookie one carried the elite
; tank numbers (RHINAPE) and the elite one the rookie's (AP), so promotion
; made it weaker against vehicles. Each takes back its own.
[TurretAP]
Verses=20%,20%,20%,100%,90%,80%,55%,30%,55%,30%,100%
Versus.s_siren2=-90%
Versus.s_seamon=80%

[TurretAPE]
Verses=20%,20%,20%,105%,95%,85%,55%,30%,55%,30%,100%
Versus.s_siren2=-95%
Versus.s_seamon=75%

; The elite Paladin missile lost the rookie's scatter (every other elite
; projectile copies it), so it scattered twice as far as the rookie's.
[JagdStrikeE]
BallisticScatter.Min=0.25
BallisticScatter.Max=0.5

; The elite garrisoned Knightframe dealt 45% to heroes where its rookie
; and every other rookie/elite pair agree; the Basilisk's elite shell hit
; light armour below its rookie's, breaking the descending steps; the
; Harpy's rookie garrison bolt did 54 where its elite and the open-field
; Longbow do 55; and the elite Magnetron beam lost the rookie's beam style.
[KnightSABE]
Versus.libra=50%
Versus.librc=50%
Versus.riot=50%
Versus.tany=50%

[BasiliskWHE]
Verses=70%,60%,50%,20%,15%,10%,35%,35%,30%,40%,100%

[UCLongbow]
Damage=55

[MagneticBeamE]
Wave.IsBigLaser=yes

; The Desolator's and Eradicator's rookie deploy weapons set their own
; beam colour (250,130,0, next to the elite's 250,100,0), which only a
; rad eruption draws, but only the elites had IsRadEruption, so the
; rookie colour never showed.
[RadEruptionWeapon]
IsRadEruption=yes

[RadEradicationWeapon]
IsRadEruption=yes

; --- Forms and copies of one unit -----------------------------------------
; A unit's modes and its AI copy share its defences and stats: the Lobber
; Speeder lost the Speeder's EMP resistance (and the AI builds it
; directly), the Athena Cannon showed on radar in hold-fire mode, the
; Bulldog had 5 more HP as a Painter, two copies dropped the special
; threat their originals carry, and the AI Zephyr had 10 HP less.
[TRIKE2]
EMP.Modifier=25%

[BASS2]
RadarInvisible=yes

[ETNK2]
Strength=395

[AICLEG]
SpecialThreatValue=1

[CHRTNK2]
SpecialThreatValue=1

[AIHOWI]
Strength=360

; --- Buildings and superweapons -------------------------------------------
; The Tech Military Docks never promoted the Angelshark: it was added to
; the Heavy Machinery's ignore list but not to the docks' own list. The
; campaign AI's Allied shipyard alone of the four AI yards repaired
; nothing. The campaign Ion Storm spelled Lightning.Separation
; "Seperation", so its bolts kept the default 3-cell spacing.
[CADOCK]
Academy.Types=LCRF,DEST,AEGIS,CARRIER,HCRUIS,SIREN,SIREN2,DLPH,SAPC,SUB,SUB2,SWLF,REAP,REAPL,DBOAT,DRED,AKULA,SLED,SQD,NAUT,BSUB,SWORD,LEVI,MANTA,SHARK

[GAYARDAI]
UnitRepair=yes

[IonStormSpecial]
Lightning.Separation=2
-Lightning.Seperation

; The campaign Mental Omega Device names a select voice soundmo never
; defines; the Psychic Dominator, which it imitates, uses DominatorSelect.
[MODEV]
VoiceSelect=DominatorSelect
