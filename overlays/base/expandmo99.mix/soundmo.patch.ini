; Mental Omega 3.3.6 sound fixes (Ares only, no Phobos keys).
;
; A sound entry plays one of its samples at random, and a sample no audio
; bag holds plays nothing, so a typo silences that pick. New entries go at
; the end of [SoundList]: maps play sounds by index as well as by name.

; --- Sample-name typos ------------------------------------------------------
; Each intended sample ships in audio01.idx and no other entry uses it.
[DeviatorSelect]
Sounds=$vdevsela $vdevselb $vdevselc $vdevseld $vdevsele $vdevself

[DustdevilAttackCommand]
Sounds=gradio1a gradio1b gradio1c gradio1d gradio1e gradio1f gradio1g vdustatta vdustattb vdustattc vdustattd vdustatte vdustattf vdustattg vdustatth gradio3a gradio3b gradio3c gradio3d gradio3e gradio3f gradio3g

[FuryDroneMove]
Sounds=$vfurymoa $vfurymob

[GrumbleMoveStart]
Sounds=$vgrumstaa $vgrumstab $vgrumstac

[GrumbleVoiceDeploy]
Sounds=$vgrumdpva $vgrumdpvb $vgrumdpvc $vgrumdpvd $vgrumdpve $vgrumdpvf

[PlagueSplatterAttackCommand]
Sounds=$iplagatta $iplagattb $iplagattc $iplagattd $iplagatte

[PurgerAttackCommand]
Sounds=gradio1a gradio1b gradio1c gradio1d gradio1e gradio1f gradio1g $vpurgatta $vpurgattb $vpurgattc $vpurgattd $vpurgatte $vpurgattf $vpurgattg $vpurgatth $vpurgatti gradio3a gradio3b gradio3c gradio3d gradio3e gradio3f gradio3g

[RamwagonMoveStart]
Sounds=vramwstaa vramwstab vramwstac

[SaboteurEnter]
Sounds=$isaboenta $isaboentb $isaboentc $isaboentd $isaboente $isaboentf

[ObjectiveBonus]
Sounds=uobjectiveb

; --- Samples MO never shipped ---------------------------------------------
; The rest of each series ships; dropping the missing one makes every pick
; audible (half the Whipray's select clicks were silent). The Yunru's sixth
; deploy line ships as iyundepf, the length of the others.
[MantaSelect]
Sounds=$vwhipselb

[DustdevilCrashing]
Sounds=vdustcraa vdustcrab vdustcrac

[MWFSelect]
Sounds=$vsfstsela $vsfstselb $vsfstselc $vsfstseld $vsfstsele

[NautilusSelect]
Sounds=$vbooseb $vboosec $vboosed $vbooa1c $vbooa1e

[PerunSelect]
Sounds=$vperuselb $vperuselc $vperuseld $vperusele $vperuself

[ZephyrMove]
Sounds=$vzefrmoa $vzefrmob $vzefrmoc $vzefrmod $vzefrmoe

[YunruDeployCommand]
Sounds=$iyunat2a $iyunat2b $iyunat2c $iyunat2d $iyunat2e $iyundepf

; --- Keys the engine reads under another name -----------------------------
; Their sibling DracoTurretSelect writes FShift, and Priority is spelt so
; everywhere else; MadMineSlam stayed at normal priority and could be culled.
[DracoTurretMove]
FShift=-3 3
-Shift

[DracoTurretAttackCommand]
FShift=-3 3
-Shift

[MadMineSlam]
Priority=high
-Priorty

; --- Entries named but never defined --------------------------------------
; The Future Tank turrets play FTankRotate, which no entry defined, while
; vftrota/b/c ship unused; MO's vehicle rotate sounds look like AvalonRotate.
; Maps play BeaconPlaced, ChronoMinerTeleport and WarningAlarm under
; shortened or misspelt names (coop_apanzer, fcapsule, emigdal, agrid,
; stroph); each alias plays the same samples.
[SoundList]
+=FTankRotate
+=BeaconP
+=beaconpl
+=ChronoMiner
+=Warning

[FTankRotate]
Sounds=vftrota vftrotb vftrotc
Control=loop random all decay attack
Range=20
Volume=50

[BeaconP]
Sounds=ubeacon
Type=global
Priority=critical
Volume=80

[beaconpl]
Sounds=ubeacon
Type=global
Priority=critical
Volume=80

[ChronoMiner]
Sounds=vchrtele
Limit=1
Control=interrupt
Volume=50

[Warning]
Sounds=uwarning
Priority=critical
Control=interrupt

