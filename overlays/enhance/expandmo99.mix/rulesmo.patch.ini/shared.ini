; Mental Omega 3.3.6 gameplay rewritten with Phobos v0.5-alpha2, applied
; on top of overlays/base and overlays/phobos. This file holds the global
; keys, the shared Phobos types and the objects several sides use; the
; side files hold everything else, one section per object.
;
; Every object keeps its MO role, faction, tech level and cost. A rule
; changes how it plays that role: it replaces a workaround MO had to build
; under Ares 3.0 with the mechanic Phobos provides, or removes a limit
; that worked against the role. Rules apply to every object that fits
; them, on all sides, and the AI is given what it needs to use them.
; Changes that only restore MO's own numbers under the Phobos engine live
; in overlays/phobos; fixes to MO's data that need no Phobos live in
; overlays/base.
;
; Rules (the tag before each key group in the side files):
; - aura: a building or unit whose job is a field around itself fires
;   that field on its own cell (AutoTargetOwnPosition). MO faked this by
;   "attacking" a friendly with a 384-cell relay weapon whose projectile
;   burst into the real one, by a hidden auto-firing superweapon, or by a
;   hidden passenger, so a field lapsed without a friendly in range or
;   waited for the AI's superweapon pass. The real weapon, its rate, its
;   range ring and the relay's anim and sound are kept.
; - anti-air: units whose real anti-air weapon sat behind a dummy Primary
;   fire it as Primary. LandTargeting=1 and NavalTargeting=6 keep them off
;   ground targets (Phobos also stops them at trees and empty water), and
;   projectiles that only such units fire are AAOnly.
; - torpedo: torpedoes are stopped by land, so subs move to a clear line
;   instead of emptying volleys into a coast.
; - pursuit: units that must touch their target (bites, punches, leaps,
;   planted and suicide bombs) head for the target itself rather than a
;   point on the arc of their range, so they catch moving targets.
; - siege-transport: open-topped hulls whose own gun is their purpose
;   (Centurion, Catastrophe, Battle Tortoise, Nautilus) fight at their own
;   range instead of closing to their shortest-ranged passenger's.
; - carrier: reusable craft take their carrier's rank (MO's veteran
;   carriers launched rookie craft), turn back 2 cells past the launch
;   range, and leave 10 frames apart instead of 20; a powered nest loses
;   its airborne craft at low power. Since rank now reaches the craft, a
;   carrier needs 1.5x the kills to rank up (it takes 50% of their kill
;   value instead of 75%).
; - dead-zone: inside the main gun's minimum range the unit fires its
;   secondary instead of standing idle.
; - gattling: an escalation survives the moment between two targets (one
;   normal shot of grace); a ramp that belongs to its target (Cryocopter
;   freeze) restarts on each new target.
; - infiltrator: disguised infiltrators move at the speed of the infantry
;   they pose as.
; - stack-cap: stacking marks are Phobos effects with a cap: Syncronin
;   bonds 3 per building (one per Syncronin; a Syncronaut's longer bonds
;   count towards the same 3 and land on its target), Oxidizer marks 2 per
;   aircraft (another Oxidizer moves on to an unmarked one), and Ruiner
;   suppression is not fired again at a target already silenced. MO's
;   Ares effects stacked without limit (0.8^n armour).
; - jammer: a transport whose weapons are disabled also stops passengers
;   firing out of it (Raccoon, Orcinus, freeze and chrono effects).
; - iron-curtain: player-controlled units neither pick nor return fire at
;   targets under the Iron Curtain or Iron Guard, which they cannot hurt;
;   the skirmish AI already ignored them, and force-fire still works.
; - naval-siege (AI): bombardment ships may pick targets on land within
;   their weapon range; the AI's same-zone rule kept them idle at sea.
; - deploy-fire (AI): AI GIs, Guardian GIs and Snipers deploy to fire
;   like players do (vanilla skipped this for the AI).
; - power (AI): the AI keeps spare power of 10% of its drain instead of a
;   flat 50, so losing one plant late on no longer browns out its base.
; - timer: objects whose lifetime was an anim damaging them (Elite
;   Reserves, Kingsnake portal, vision tower, Magnetic Beam, Signal
;   Jammer; nothing else can hurt them) die by AutoDeath at the frame the
;   anim would have killed them; the anim stays as a visual. Objects that
;   enemies can also damage keep MO's decay, which is part of their
;   durability.
; - self-superweapon: a superweapon that sent an invisible hunter-seeker
;   only to set off a warhead over its owner's own base (Gear Change,
;   Nanocharge) fires that warhead at its building on one click, and the
;   AI can use it (MO's AI never fired Gear Change).
; - upgrade-in-place: Nanofiber Sync converts the infantry it upgrades
;   (Phobos Convert) instead of killing them and spawning the upgrade
;   from a death anim, so they keep rank, group, orders and effects and
;   count no loss; they are healed to full as MO's newborns were.
; - close-range: the Cyclops' double damage within 3.5 cells is a second
;   weapon it switches to there, glowing as before, instead of a hidden
;   passenger buffing it.
; - ai-twin: the Cryocopter's AI copy uses the player's cryo beams; a
;   target filter (no empty ground) keeps the player from force-firing at
;   the ground, which a projectile flag did, and needed the copy.
; - rider: an effect warhead (EMP, driver kill, slows, stuns, freezes,
;   marks, the Rahn's Clairvoyant kill) that a projectile set off through
;   an airburst helper weapon is an ExtraWarheads entry of the weapon,
;   with the helper's damage; it lands on the impact point rather than a
;   cluster cell beside it.
; - registration: weapons and warheads these rules add, listed where YR
;   and Phobos look them up.

[General]
; jammer
OpenTopped.CheckTransportDisableWeapons=true

[AI]
; power
PowerSurplus.ScaleToDrainAmount=500

[AttachEffectTypes]
; stack-cap
+=EnhanceSyncroninBond
+=EnhanceOxidizerMark
+=EnhanceRuinerSuppression
; close-range
+=EnhanceCyclopsGlow

[AeroProj]
; anti-air
AAOnly=yes

