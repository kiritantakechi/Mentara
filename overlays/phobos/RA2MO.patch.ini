; Phobos player-facing UX, HUD, and quality-of-life settings.
; Only the [Phobos] section is managed here: the client's options menu
; owns [Options], [Video], and [Audio], and this patch is re-applied on
; every launch, so patching those would undo the player's choices.

[Phobos]
; --- Extended Sidebar Tooltips (Crisp Carbon-Glass, No RGB565 Blur Smear) ---
ToolTipDescriptions=true
ToolTipBlur=false

; --- Smart Selection, Holographic SelectBox & Deployment ---
EnableSelectBox=true
PrioritySelectionFiltering=true
PriorityDeployFiltering=true
TypeSelectUseIFVMode=true
ShowFlashOnSelecting=true

; --- Building Placement & Tactical Range Indicators ---
ShowPlacementPreview=true
ShowDesignatorRange=true
ShowPowerPlantEnhancerRange=true

; --- Sidebar & On-Screen HUD Counters ---
DigitalDisplay.Enable=true
ShowPowerDelta=true
ShowHarvesterCounter=true
ShowGameTime=true
ShowGameTime.BoardOpacity=32
SuperWeaponSidebar.RequiredSignificance=0

; --- Messages ---
; MO's own top-left message list; hovering it keeps messages from
; fading. The centred board (and its toggle button) stays off.
MessageApplyHoverState=true
MessageDisplayInCenter=false

; --- Real-Time Adaptive Timers ---
RealTimeTimers=true
RealTimeTimers.Adaptive=true

; --- Single-Player Campaign QoL ---
SaveGameOnScenarioStart=true
; Player-side switch only: a briefing appears when the mission itself
; sets ShowBriefing=true.
ShowBriefing=true
CampaignDefaultGameSpeed=4

; --- Visual Effects ---
HideLightFlashEffects=false
HideLaserTrailEffects=false
HideShakeEffects=false
