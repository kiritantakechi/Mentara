; Phobos v0.5-alpha2 player-facing UX, HUD, and quality-of-life settings.

[Options]
ToolTips=yes
SidebarCameoText=yes
UnitActionLines=yes
ShowHidden=yes

[Phobos]
; --- Extended Sidebar Tooltips (Crisp Glass, No RGB565 Blur Smear) ---
ToolTipDescriptions=true
ToolTipBlur=false

; --- Smart Selection, Isometric SelectBox & Deployment ---
EnableSelectBox=true
PrioritySelectionFiltering=true
PriorityDeployFiltering=true
TypeSelectUseIFVMode=true
ShowFlashOnSelecting=true

; --- Building Placement & Range Indicators ---
ShowPlacementPreview=true
ShowDesignatorRange=true
ShowPowerPlantEnhancerRange=true

; --- Sidebar & On-Screen HUD Counters ---
DigitalDisplay.Enable=true
ShowPowerDelta=true
ShowHarvesterCounter=true
ShowGameTime=true
ShowGameTime.BoardOpacity=35
SuperWeaponSidebar.RequiredSignificance=0

; --- Modern Centered Subtitle & Message Board ---
MessageApplyHoverState=true
MessageDisplayInCenter=true
MessageDisplayInCenter.BoardOpacity=38
MessageDisplayInCenter.LabelsCount=6
MessageDisplayInCenter.RecordsCount=12

; --- Real-Time Adaptive Timers ---
RealTimeTimers=true
RealTimeTimers.Adaptive=true

; --- Single-Player Campaign QoL ---
SaveGameOnScenarioStart=true
ShowBriefing=true
CampaignDefaultGameSpeed=4

; --- Visual Effects ---
HideLightFlashEffects=false
HideLaserTrailEffects=false
HideShakeEffects=false
