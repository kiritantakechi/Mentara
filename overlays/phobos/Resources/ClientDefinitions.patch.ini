; Phobos v0.5-alpha2 + SyringeEx 0.1.0.2 client launch patch.
; SyringeEx 0.1.0.2 requires game flags (-SPAWN, -CD, etc.) to be wrapped
; inside `--args="..."` and suppresses the alpha tag notice via
; `-HideVersionWarning=0.5.0.0-alpha2`.

[Settings]
GameExecutableNames=Syringe.exe
GameLauncherExecutableName=
ExtraCommandLineParams=gamemd.exe --args="-SPAWN -CD -SPEEDCONTROL -LOG -AFFINITY:1048575 -HideVersionWarning=0.5.0.0-alpha2"
