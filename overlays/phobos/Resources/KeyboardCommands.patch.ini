; Phobos v0.5-alpha2 in-game keyboard commands exposed in Mental Omega Client.

[Next Idle Harvester]
UIName=选择空闲矿车
Category=选择
Description=选中下一辆当前未在采矿的矿车并居中视野
DefaultKey=85

[Select Captured Units]
UIName=选择被俘获/心控单位
Category=选择
Description=选中当前选区或屏幕内被心灵控制或俘获的单位
DefaultKey=74

[DeselectOne]
UIName=取消选中 1 个单位
Category=选择
Description=从当前选中的部队中移除 1 个单位
DefaultKey=324

[DeselectFive]
UIName=取消选中 5 个单位
Category=选择
Description=从当前选中的部队中移除 5 个单位
DefaultKey=580

[Toggle Digital Display]
UIName=切换数值状态显示
Category=界面
Description=开启或关闭单位与建筑上方的微缩数值状态显示
DefaultKey=73

[Toggle Designator Range]
UIName=切换超武/增幅范围圈
Category=界面
Description=开启或关闭超级武器指示器、抑制器与电厂增幅器的范围提示圈
DefaultKey=79

[Toggle Super Weapon Sidebar]
UIName=切换超武侧栏
Category=界面
Description=展开或收起屏幕左侧的超级武器快捷栏
DefaultKey=0

[Quicksave]
UIName=快速存档
Category=界面
Description=在单人战役或任务中立即执行快速保存
DefaultKey=632

; [Display Damage Numbers] is a Phobos developer command that only exists
; with debug keys on, and MO sets [GlobalControls] DebugKeysEnabled=no.

; Super weapon sidebar slots 1-10 (needs SuperWeaponSidebarKeysEnabled).
