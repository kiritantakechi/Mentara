; Phobos v0.5-alpha2 in-game keyboard commands exposed in Mental Omega Client.

[Next Idle Harvester]
UIName=选择空闲矿车
Category=选择
Description=选中下一辆当前未在采矿的矿车并居中视野
DefaultKey=85

[Select Captured Units]
UIName=选择被俘获/心控单位
Category=选择
Description=选中当前选区或屏幕内被心灵控制或俘获的单位
DefaultKey=74

[DeselectOne]
UIName=取消选中 1 个单位
Category=选择
Description=从当前选中的部队中移除 1 个单位
DefaultKey=324

[DeselectFive]
UIName=取消选中 5 个单位
Category=选择
Description=从当前选中的部队中移除 5 个单位
DefaultKey=580

[Toggle Digital Display]
UIName=切换数值状态显示
Category=界面
Description=开启或关闭单位与建筑上方的生命值及生产进度数值显示
DefaultKey=73

[Toggle Designator Range]
UIName=切换超武/增幅范围圈
Category=界面
Description=开启或关闭超级武器指示器、抑制器与电厂增幅器的范围提示圈
DefaultKey=79

[Toggle Message Label]
UIName=切换中央消息面板
Category=界面
Description=在屏幕中央消息面板与左上角传统消息列表之间切换
DefaultKey=596

[Quicksave]
UIName=快速存档
Category=界面
Description=在单人战役或任务中立即执行快速保存
DefaultKey=632

[Display Damage Numbers]
UIName=显示伤害数字
Category=扩展功能
Description=切换跳出式实时武器伤害数字显示
DefaultKey=0
