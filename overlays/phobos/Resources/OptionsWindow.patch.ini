; Hide MO's optional `savefixmo.dll` ("存档功能修正") under Phobos.
; It hooks seven of the same save/load addresses as Phobos, and
; both write their own block into the save stream, so loading both is
; unsupported, and SyringeEx would inject it from the game root.
; Phobos already fixes its BuildOffAlly-after-load bug; its other fix
; (map lighting after loading a save) has no Phobos equivalent, so the
; `base` profile, which keeps stock Syringe, still offers the option.

[-GameOptionsPanelExtraControls]

[chkSavedGameFixes]
Checked=False
Enabled=no
Visible=0

[lblSavedGameFixes]
Visible=0
