; Phobos v0.5-alpha2 art for the animations the rules patch registers.

; Promotion insignia rising over a promoted unit with a twinkling glint
; (Promote.*Animation in rulesmo.patch.ini). It is overhead UI like the
; health bar, so it takes the top layer, and its art stays entirely
; above the unit: an anim has one layer and one depth mode, so anything
; drawn at the unit's feet would paint over its body and over whatever
; stands in front (ground art must be flat in the depth buffer, as the
; selection rings are). Frames are 2 game frames each (900 / Rate); the
; palette ignores map lighting; it shows only to the owner and allies
; (it would give away disguised units), hides while its unit is
; cloaked, and fades out over the last third.
[PHRANKV]
Rate=450
CustomPalette=phrank.pal
UseNormalLight=yes
Shadow=no
Layer=top
Layer.UseObjectLayer=false
VisibleTo=team
RestrictVisibilityIfCloaked=true
Translucency.Keyframe0.Percentage=0.0
Translucency.Keyframe0.Value=0
Translucency.Keyframe1.Percentage=0.63
Translucency.Keyframe1.Value=25
Translucency.Keyframe2.Percentage=0.77
Translucency.Keyframe2.Value=50
Translucency.Keyframe3.Percentage=0.9
Translucency.Keyframe3.Value=75

[PHRANKE]
Rate=450
CustomPalette=phrank.pal
UseNormalLight=yes
Shadow=no
Layer=top
Layer.UseObjectLayer=false
VisibleTo=team
RestrictVisibilityIfCloaked=true
Translucency.Keyframe0.Percentage=0.0
Translucency.Keyframe0.Value=0
Translucency.Keyframe1.Percentage=0.63
Translucency.Keyframe1.Value=25
Translucency.Keyframe2.Percentage=0.77
Translucency.Keyframe2.Value=50
Translucency.Keyframe3.Percentage=0.9
Translucency.Keyframe3.Value=75

; --- Firing anims of air units draw in their unit's layer ---
; A firing anim is attached to its firer, and the engine puts attached
; anims on the ground layer whatever their own Layer=, so an aircraft's
; or jumpjet's muzzle flash was drawn under the aircraft itself and
; under anything sorted after it. Every anim that a weapon of an air
; unit (AircraftTypes, and Fly or Jumpjet locomotors) fires now follows
; its firer's layer: the air for aircraft, the ground as before for the
; ground units that share it.
