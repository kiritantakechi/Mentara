; Phobos v0.5-alpha2 modernization, visual HUD, control, physics, and QoL rules
; patch, applied after overlays/base on top of Mental Omega 3.3.6's
; `rulesmo.ini` (inside expandmo99.mix). Several keys change gameplay, so
; online games need every player on the same layer set.

[General]
; --- Production, Economy & Factory QoL ---
BuildingProductionQueue=true
SetTabBySelectingFactory=true
BuildingWaypoints=true
BuildingTypeSelectable=true
ExtendedPlayerRepair=true
HarvesterScanAfterUnload=true
SortCameoByName=true

; --- Modern RTS Combat, Micro & Unit Responsiveness ---
TypeSelectUseIFVMode=true
AttackMove.Aggressive=true
AttackMove.UpdateTarget=true
ApproachTarget.StopWhenInRange=true
ExtendedAircraftMissions=true
NoTurret.TrackTarget=true
RecountBurst=true
JumpjetClimbPredictHeight=true
JumpjetClimbWithoutCutOut=true

; --- Fast Transport, Bunker & Amphibious Boarding / Unloading ---
NoQueueUpToEnter=true
NoQueueUpToUnload=true
NoQueueUpToEnter.Buildings=true
NoQueueUpToUnload.Buildings=true
AmphibiousEnter=true
AmphibiousUnload=true

; --- Single-Player & Skirmish Communication / Beacons ---
AllowChatBoxInSinglePlayer=true
AllowBeaconHotKeyInSinglePlayer=true
AutoRemoveEarliestBeacon=true
SkirmishUnlimitedColors=true

; --- Engine Performance, Rendering, Pathing & Targeting Fixes ---
; Vanilla targeting settled for the first target found within part of
; the weapon's range instead of the best one in range.
DisableOveroptimizationInTargeting=true
DistributeTargetingFrame=true
DistributeTargetingFrame.AIOnly=false
ShakeIsLocal=true
FixTransparencyBlitters=true
FixRepairStepCost=true
FallingDownTargetingFix=true
AIAirTargetingFix=true
BalloonHoverPathingFix=true
DecloakDamagedTargets=true

[GlobalControls]
SelectCapturedKeyEnabled=true
SuperWeaponSidebarKeysEnabled=true

[CombatDamage]
; Use the Secondary weapon against walls the Primary cannot damage
; (vanilla kept firing the useless Primary).
AllowWeaponSelectAgainstWalls=true

[AI]
; Vanilla AI ignored [AI] PowerSurplus (MO: 50) and built power only to
; break even; with this it keeps that buffer.
EnablePowerSurplus=true

[AudioVisual]
; --- Floating Income & Money Drain Feedback ---
DisplayIncome=true
DisplayIncome.Houses=self,allies
DisplayIncome.AllowAI=false
DrainMoneyDisplay=true
DrainMoneyDisplay.Houses=all
DrainMoneyDisplay.OnTarget=true

; --- Translucent Building Placement Preview & Holographic Grid (`place.shp`) ---
PlacementPreview=true
PlacementPreview.Translucency=50
PlacementGrid.Translucency=50
PlacementGrid.TranslucencyWithPreview=50

; --- Modern Dynamic Flight Banking, Shadows, Voxel Lighting & Water Wakes ---
JumpjetTilt=true
JumpjetTilt.ForwardAccelFactor=0.85
JumpjetTilt.ForwardSpeedFactor=0.85
JumpjetTilt.SidewaysRotationFactor=0.9
JumpjetTilt.SidewaysSpeedFactor=0.9
JumpjetLevelLightMultiplier=0.35
DrawTurretShadow=true
HeightShadowScaling=true
HeightShadowScaling.MinScale=0.5
UseFixedVoxelLighting=true
UseRetintFix=true
NoAlphaImageOnBuildup=true
WalkLocomotorMakesWake=true
DriveLocomotorMakesWake=true

; --- Light-Flash Effects Follow Player Detail & Effect Settings ---
; The [Phobos] HideLightFlashEffects toggle also hides warhead particle
; AlphaImages, and the lowest detail level skips flash and combat-light
; effects entirely.
WarheadParticleAlphaImageIsLightFlash=true
LightFlashAlphaImageDetailLevel=1
CombatLightDetailLevel=1

; --- Tactical Indicators, Range Rings, Timers & SuperWeapon Dock ---
RadialIndicatorVisibility=self,allies
ShowDesignatorRange=true
ShowPowerPlantEnhancerRange=true
SuperWeaponSidebar.AllowByDefault=true
TimerBlinkColorScheme=LightBlue
AirstrikeLineColor=92,224,255

; --- Off-Screen Combat Voice Alerts ---
; MO's evamo.ini has no EVA_UnitsInCombat, so only unit voices are used.
; CombatAlert.Default stays unset: the built-in default already skips
; Insignificant and Spawned technos (drones, missiles, spawned aircraft).
CombatAlert=true
CombatAlert.UseEVA=false
CombatAlert.IgnoreBuilding=true
CombatAlert.SuppressIfInScreen=true
CombatAlert.SuppressIfAllyDamage=true
CombatAlert.MakeAVoice=true
CombatAlert.UseFeedbackVoice=true
CombatAlert.UseAttackVoice=true
CombatAlert.Interval=150

; --- Selection, Insignia & Tooltip Defaults ---
SelectionFlashDuration=3
DrawInsignia.UsePixelSelectionBracketDelta=true
DrawInsignia.AdjustPos.BuildingsAnchor=top
DigitalDisplay.Health.FakeAtDisguise=true
ToolTip.Background.Color=10,15,24
ToolTip.Background.Opacity=88
ToolTip.Background.BlurSize=0.0

; --- HUD colour system ---
; One set of tones for every Phobos readout, so health reads the same on
; selection rings, hover numbers and the power counter:
;   green 118,236,140   amber 248,208,96   red 248,100,96
; Rings and the number appear only for selected or hovered units.

; Thin ground ellipse per selected unit, tinted by health (frames 0-2 of
; phselinf/phselunt.shp, built from assets/phobos/expandmo50.mix). No drop
; lines: a ring under an aircraft already places it.
DefaultInfantrySelectBox=PhobosInfantrySelectBox
DefaultUnitSelectBox=PhobosUnitSelectBox

; Hover readouts: a 3x5 pixel font (phdigit.shp, see
; assets/phobos/expandmo50.mix) sitting right on the health bar.
Infantry.DefaultDigitalDisplayTypes=PhobosUnitHealthDisplay
Vehicles.DefaultDigitalDisplayTypes=PhobosUnitHealthDisplay
Aircraft.DefaultDigitalDisplayTypes=PhobosUnitHealthDisplay
Buildings.DefaultDigitalDisplayTypes=PhobosBuildingHealthDisplay,PhobosFactoryProgressDisplay

[SelectBoxTypes]
+=PhobosInfantrySelectBox
+=PhobosUnitSelectBox

[PhobosInfantrySelectBox]
DrawAboveTechno=false
Translucency=25
VisibleToHouses=all
GroundShape=phselinf.shp
GroundPalette=phsel.pal
GroundFrames=0,1,2
Ground.AlwaysDraw=true

[PhobosUnitSelectBox]
DrawAboveTechno=false
Translucency=25
VisibleToHouses=all
GroundShape=phselunt.shp
GroundPalette=phsel.pal
GroundFrames=0,1,2
Ground.AlwaysDraw=true

[DigitalDisplayTypes]
+=PhobosUnitHealthDisplay
+=PhobosBuildingHealthDisplay
+=PhobosFactoryProgressDisplay

[PhobosUnitHealthDisplay]
InfoType=health
ShowType=cursorhover
VisibleToHouses=all
Anchor.Horizontal=center
Anchor.Vertical=top
Align=center
Offset=0,1
Shape=phdigit.shp
Palette=phdigit.pal
Shape.Spacing=4,0

; Buildings: parallel to the isometric health bar, which rises 2px per
; 4px (Phobos subtracts the Y spacing per glyph, and its 4,-2 default
; would descend), shifted down the slope to sit over the bar.
[PhobosBuildingHealthDisplay]
InfoType=health
ShowType=cursorhover
VisibleToHouses=all
Anchor.Building=top
Align=center
Offset=-18,9
Shape=phdigit.shp
Palette=phdigit.pal
Shape.Spacing=4,2

; Factory progress: horizontal, ending just left of the bar's lower end.
[PhobosFactoryProgressDisplay]
InfoType=factoryprocess
ShowType=cursorhover
VisibleToHouses=self,allies
Anchor.Building=lefttop
Align=right
Offset=-3,3
Percentage=true
HideMaxValue=true
Shape=phdigit.shp
Palette=phdigcy.pal
Shape.Spacing=4,0

