; Phobos v0.5-alpha2 modernization, visual HUD, control, and QoL rules patch
; applied on top of Mental Omega 3.3.6's base `rulesmo.ini` (from expandmo99.mix).

[General]
; --- Production & Structure QoL ---
BuildingProductionQueue=true
SetTabBySelectingFactory=true
BuildingWaypoints=true
BuildingTypeSelectable=true
ExtendedPlayerRepair=true
ShowGameTime=true

; --- Fast Transport & Bunker Boarding / Unloading ---
NoQueueUpToEnter=true
NoQueueUpToUnload=true

; --- Single-Player & Skirmish Communication / Beacons ---
AllowChatBoxInSinglePlayer=true
AllowBeaconHotKeyInSinglePlayer=true
AutoRemoveEarliestBeacon=true
SkirmishUnlimitedColors=true

; --- Engine Rendering, Pathing & Targeting Fixes ---
FixTransparencyBlitters=true
FixRepairStepCost=true
FallingDownTargetingFix=true
AIAirTargetingFix=true
BalloonHoverPathingFix=true
DecloakDamagedTargets=true

[GlobalControls]
SelectCapturedKeyEnabled=true
SuperWeaponSidebarKeysEnabled=true

[AudioVisual]
; --- Floating Income & Money Drain Feedback ---
DisplayIncome=true
DisplayIncome.Houses=self,allies
DisplayIncome.AllowAI=false
DrainMoneyDisplay=true
DrainMoneyDisplay.Houses=all
DrainMoneyDisplay.OnTarget=true

; --- Translucent Building Placement Preview & Soft Grid ---
PlacementPreview=true
PlacementPreview.Translucency=50
PlacementGrid.Translucency=50
PlacementGrid.TranslucencyWithPreview=75

; --- Dynamic Shadows, Voxel Lighting & Water Wakes ---
DrawTurretShadow=true
HeightShadowScaling=true
HeightShadowScaling.MinScale=0.5
UseFixedVoxelLighting=true
UseRetintFix=true
WalkLocomotorMakesWake=true
DriveLocomotorMakesWake=true
HoverLocomotionClassMakesWake=true
ShipLocomotionClassMakesWake=true

; --- Radial Rings & SuperWeapon Dock ---
RadialIndicatorVisibility=self,allies
SuperWeaponSidebar.AllowByDefault=true

; --- Tactical Off-Screen Combat Voice Alerts ---
CombatAlert=true
CombatAlert.Default=true
CombatAlert.IgnoreBuilding=true
CombatAlert.SuppressIfInScreen=true
CombatAlert.SuppressIfAllyDamage=true
CombatAlert.MakeAVoice=true
CombatAlert.UseFeedbackVoice=true
CombatAlert.UseAttackVoice=true
CombatAlert.Interval=150

; --- Crisp Selection, Insignia & Glass Tooltip Defaults ---
SelectionFlashDuration=3
DrawInsignia.UsePixelSelectionBracketDelta=true
ToolTip.Background.Color=12,16,24
ToolTip.Background.Opacity=86
ToolTip.Background.BlurSize=0.0

; --- Modern Isometric Ground Selection Rings & Air Drop-Lines ---
DefaultInfantrySelectBox=PhobosInfantrySelectBox
DefaultUnitSelectBox=PhobosUnitSelectBox

; --- Crisp Pixel-Art SHP Micro-HUD Digital Displays ---
Infantry.DefaultDigitalDisplayTypes=PhobosUnitHealthDisplay
Vehicles.DefaultDigitalDisplayTypes=PhobosUnitHealthDisplay
Aircraft.DefaultDigitalDisplayTypes=PhobosUnitHealthDisplay
Buildings.DefaultDigitalDisplayTypes=PhobosBuildingHealthDisplay,PhobosFactoryProgressDisplay

[SelectBoxTypes]
+=PhobosInfantrySelectBox
+=PhobosUnitSelectBox

[PhobosInfantrySelectBox]
DrawAboveTechno=false
Translucency=25
VisibleToHouses=all
GroundShape=phselinf.shp
GroundPalette=phsel.pal
GroundFrames=0,1,2
Ground.AlwaysDraw=true
GroundLine=true
GroundLine.Dashed=true
GroundLineColor=76,238,148
GroundLineColor.ConditionYellow=255,202,68
GroundLineColor.ConditionRed=255,84,96

[PhobosUnitSelectBox]
DrawAboveTechno=false
Translucency=25
VisibleToHouses=all
GroundShape=phselunt.shp
GroundPalette=phsel.pal
GroundFrames=0,1,2
Ground.AlwaysDraw=true
GroundLine=true
GroundLine.Dashed=true
GroundLineColor=76,238,148
GroundLineColor.ConditionYellow=255,202,68
GroundLineColor.ConditionRed=255,84,96

[DigitalDisplayTypes]
+=PhobosUnitHealthDisplay
+=PhobosBuildingHealthDisplay
+=PhobosFactoryProgressDisplay

[PhobosUnitHealthDisplay]
InfoType=health
ShowType=cursorhover
VisibleToHouses=all
Anchor.Horizontal=center
Anchor.Vertical=top
Align=center
Offset=0,-2
Shape=phdigit.shp
Palette=phdigit.pal
Shape.Spacing=5,0
Text.Background=false

[PhobosBuildingHealthDisplay]
InfoType=health
ShowType=cursorhover
VisibleToHouses=all
Anchor.Building=top
Align=right
Offset=-4,-1
Shape=phdigit.shp
Palette=phdigit.pal
Shape.Spacing=5,-2
Text.Background=false

[PhobosFactoryProgressDisplay]
InfoType=factoryprocess
ShowType=cursorhover
VisibleToHouses=self,allies
Anchor.Building=lefttop
Align=left
Offset=4,2
Percentage=true
HideMaxValue=true
Shape=phdigit.shp
Palette=phdigcy.pal
Shape.Spacing=5,0
Text.Background=false

