[DigitalDisplayTypes]
+=PhobosUnitHealth
+=PhobosUnitHealthTeam
+=PhobosBuildingHealth
+=PhobosBuildingHealthTeam
+=PhobosFactoryProgress

[PhobosUnitHealth]
InfoType=health
ShowType=cursorhover
VisibleToHouses=all
Anchor.Horizontal=center
Anchor.Vertical=top
Align=center
Offset=0,1
Shape=phfont.shp
Palette=phfonthp.pal
Shape.Spacing=4,0

; The *Team variants show only to the owner and allies; decoys and the
; types they imitate use them (see the per-unit settings), since a
; decoy's lower health would give it away.
[PhobosUnitHealthTeam]
InfoType=health
ShowType=cursorhover
VisibleToHouses=team
Anchor.Horizontal=center
Anchor.Vertical=top
Align=center
Offset=0,1
Shape=phfont.shp
Palette=phfonthp.pal
Shape.Spacing=4,0

; Buildings: parallel to the isometric health bar, which rises 2px per
; 4px (Phobos subtracts the Y spacing per glyph, and its 4,-2 default
; would descend), shifted down the slope to sit over the bar.
[PhobosBuildingHealth]
InfoType=health
ShowType=cursorhover
VisibleToHouses=all
Anchor.Building=top
Align=center
Offset=-18,9
Shape=phfont.shp
Palette=phfonthp.pal
Shape.Spacing=4,2

[PhobosBuildingHealthTeam]
InfoType=health
ShowType=cursorhover
VisibleToHouses=team
Anchor.Building=top
Align=center
Offset=-18,9
Shape=phfont.shp
Palette=phfonthp.pal
Shape.Spacing=4,2

; Factory progress: horizontal, ending just left of the bar's lower end.
[PhobosFactoryProgress]
InfoType=factoryprocess
ShowType=cursorhover
VisibleToHouses=team
Anchor.Building=lefttop
Align=right
Offset=-3,3
Percentage=true
HideMaxValue=true
Shape=phfont.shp
Palette=phfontfp.pal
Shape.Spacing=4,0

