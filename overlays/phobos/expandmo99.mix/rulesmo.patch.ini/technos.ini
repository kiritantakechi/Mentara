; === Per-unit settings ===============================================
; One section per unit, sorted by name. Each key follows one rule:
; - LowSelectionPriority=true: every MO harvester, so a box selection
;   picks combat units first.
; - SelectBox=PhobosRingNN: a ring that clears the hull. The ring lies
;   on the ground under its unit (drawn flat in the depth buffer), so a
;   hull wider than the ring hides it. A vehicle or aircraft whose body
;   voxel sweeps past the standard ring (radius 24 px) takes the ring
;   that clears it: the sweep is half the diagonal of the body's voxel
;   bounds in MO 3.3.6, and a ring of radius r clears a half-diagonal of
;   about r / 0.56 units, so:
;     43-53.5 -> 30   53.5-67.8 -> 38   67.8-82 -> 46   more -> 58
;   (the radii step by 1.25x from the standard 24, rounded to even).
;   SHP vehicles and smaller hulls keep the default PhobosRing24.
; - TurretRecoil=yes: turret and barrel kick back 2 px on each shot (the
;   Phobos defaults), for turreted voxel vehicles with a weapon that
;   fires a gun shell. MO marks no weapon as a gun, so these are its
;   shell projectiles:
;   CannonInviso, CannonAbrams, Cannon3, CannonDraco, HowitzerProj,
;   CataProj, CenturionCannonBall, GharialProj, ReaperProj, SeawolfProj,
;   SpeederProj, SpeederProjB, ColossusBallInacc, Cannon3E,
;   CannonCavalier, CannonScourge, ColossusBallInaccE, HowitzerProjE,
;   HowitzerProjInacc, HowitzerProjInaccE, SpeederProjE, SpeederProjBE,
;   MortarProj, MortarProjE, TarchiaProj
; - DigitalDisplayTypes=Phobos*HealthTeam: every decoy (FakeOf) and each
;   type that looks like the one it imitates (same image), so enemies
;   cannot tell a decoy by its health number.
; - ForceAAWeapon.*=1: a unit whose two anti-air weapons share a warhead
;   (Guardian GI). Vanilla always fired Secondary at aircraft; Phobos
;   lets Primary fire too but cannot tell the two apart, so it chose the
;   slower one MO never used against air.
; - LandTargeting=1: a gattling unit whose ground slots are dummies
;   (Whipray). Vanilla fired the dummy at ground targets, so the ship
;   stayed anti-air; Phobos falls back to the anti-air slot instead.
; - LowDeployPriority=true: every vehicle that does something on Deploy
;   (unpacks into a building, toggles a mode, lands, unloads, or fires a
;   deploy ability such as the Demolition Truck's blast), so Deploy on a
;   mixed selection only digs in its infantry; selected alone, it still
;   deploys.
; - AttackMove.Follow=true: every unit whose weapons all heal (medics,
;   repairers), so on attack-move it trails the units it serves instead
;   of leading them.
; - AttackMove.Follow.IfMindControlIsFull=true: every mind controller
;   with a capacity, so once full it follows its army on attack-move
;   instead of walking into the enemy.
; - OpenTopped.DecloakToFire=false: every open-topped hull whose only
;   passengers are built-in gunners that fire without uncloaking (the
;   Nautilus' and the Magnetic emitter's magnet fields), so a submerged
;   or cloaked hull stays hidden while its field pulses. Other
;   passengers uncloak their hull to fire (global.ini).
; - Harvester.CanGuardArea=true, Harvester.CanGuardArea.RequireTarget=
;   true: every harvester with a weapon that does damage (War Miner, Ultra
;   Miner). Ordered to guard an area, it stays and fights there; with no
;   target in reach it goes back to mining. Phobos applies it to players'
;   miners only, so the AI's keep mining.

