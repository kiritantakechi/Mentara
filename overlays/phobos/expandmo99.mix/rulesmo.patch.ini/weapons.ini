; === Per-weapon settings =============================================
; One section per weapon, sorted by name. Each key follows one rule:
; - Anim.Update=false: firing anims that chain on with art Next= keep
;   the vanilla behaviour (see FiringAnim.Update in global.ini).
; - LaserPositionUpdate=all: each IsLaser or DiskLaser weapon keeps its
;   beam on the firer's barrel and on its target while it lasts, instead
;   of hanging where it was fired.
; - TurretRecoil.Suppress=yes: weapons of the recoiling vehicles that
;   fire no gun shell (missiles, bullets, beams, sprays) leave the
;   turret still.
; - Burst=1, Strafing.Shots=6, Strafing.SimulateBurst=yes: strafing
;   weapons (projectile ROT below 2) with Burst=2. Vanilla fired the
;   burst on the first of a run's 5 shots only, 6 projectiles in all;
;   Phobos fires it on every shot (10), so the run fires 6 single
;   shots on alternating barrels.
; - Burst.Delays and ROF: salvos whose BurstDelayN the engine never read
;   (vehicles read only BurstDelay0-3, buildings none; the rest wait a
;   random 3-5 frames, 4 on average) get the gaps MO wrote, with ROF
;   raised by the time saved so the cycle, and the damage per second,
;   stay as they were: Buratino and Irritator salvos, Wormqueen bolts,
;   Sweeper missiles and War Rig drills. The Neutralizer, which fires
;   every frame, keeps its timing: its burst gap is its fire rate.
; - AnimList=PhobosReactorNukeBall: the Nuclear Reactor's death warhead.
;   Phobos detonates a death weapon at once (Explode, where vanilla called
;   Detonate), which skips Ares's PreImpactAnim, so the reactor lost the
;   nuke ball and its "nuke intro" sound before the blast. The ball now
;   leads the warhead's anim list and chains into the blast (art), so the
;   sight and sound return; the damage lands at once, as Phobos fires it.

