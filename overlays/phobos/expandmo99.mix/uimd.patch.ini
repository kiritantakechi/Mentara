; Phobos v0.5-alpha2 UI layout, sidebar counters, and extended tooltips patch
; applied on top of Mental Omega 3.3.6's base `uimd.ini` (from expandmo99.mix).

[Sidebar]
; Faster yet smooth credit counter rolling speed (vanilla cap is 143/frame).
CreditsIndicator.MaxStep=500
CreditsIndicator.Smooth=true

; Active / total harvester counter next to credits indicator.
HarvesterCounter.Show=true
HarvesterCounter.ConditionYellow=75%
HarvesterCounter.ConditionRed=50%

; Real-time net power surplus / deficit counter next to credits indicator.
PowerDelta.Show=true
PowerDelta.ConditionYellow=100%
PowerDelta.ConditionRed=75%

; Center pause menu background on modern high-resolution displays.
CenterPauseMenuBackground=true

[ToolTips]
; Rich extended tooltips showing cost, power, build time, and description.
ExtendedToolTips=true
AnchoredToolTips=true
MaxWidth=360

[UISettings]
ShowBriefingResumeButtonLabel=GUI:Resume
ShowBriefingResumeButtonStatusLabel=STT:BriefingButtonReturn
