; Phobos v0.5-alpha2 UI layout, sidebar counters, progress bars, SW dock,
; loading screen polish, and extended tooltips patch on top of `uimd.ini`.

[LoadingScreen]
; Hide dated vanilla black dots over unoccupied spawn positions on map previews.
DisableEmptySpawnPositions=true

[Sidebar]
; Faster yet smooth credit counter rolling speed (vanilla cap is 143/frame).
CreditsIndicator.MaxStep=500
CreditsIndicator.Smooth=true

; Active / total harvester counter aligned inside the right credits slot.
HarvesterCounter.Show=true
HarvesterCounter.Label=PHOBOS:HarvesterLabel
HarvesterCounter.ConditionYellow=99%
HarvesterCounter.ConditionRed=50%

; Real-time net power surplus / deficit counter inside the left credits slot.
; Thresholds measure power usage ratio (yellow >= 75%, red > 100%).
PowerDelta.Show=true
PowerDelta.ConditionYellow=75%
PowerDelta.ConditionRed=100%

; Ultra-slim 3px hairline glowing LED production progress bars under build tabs.
ProducingProgress.Show=true

; Superweapon sidebar on the left edge: MO's own cameos with no frame
; art, 4px from the screen edge and 4px apart (60x48 cameos).
SuperWeaponSidebar=true
SuperWeaponSidebar.Pyramid=true
SuperWeaponSidebar.Interval=4
SuperWeaponSidebar.LeftOffset=4
SuperWeaponSidebar.CameoHeight=52
SuperWeaponSidebar.Max=6
SuperWeaponSidebar.MaxColumns=3

; Center pause menu background on modern high-resolution displays.
CenterPauseMenuBackground=true

[ToolTips]
; Crisp extended tooltips with native CSF labels (no missing glyph boxes).
ExtendedToolTips=true
AnchoredToolTips=true
MaxWidth=340
CostLabel=PHOBOS:CostLabel
PowerLabel=PHOBOS:PowerLabel
PowerBlackoutLabel=PHOBOS:PowerBlackoutLabel
TimeLabel=PHOBOS:TimeLabel
SWShotsFormat=PHOBOS:SWShotsFormat

[UISettings]
ShowBriefingResumeButtonLabel=GUI:Resume
ShowBriefingResumeButtonStatusLabel=STT:BriefingButtonReturn
